name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly: catches new advisories / toolchain breakage
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Ubuntu 24.04 runners block unprivileged user namespaces via AppArmor,
      # which Nux's build sandbox needs
      - name: Allow unprivileged user namespaces (for the Nux sandbox)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Unit and integration tests
        run: cargo test --workspace --all-targets --all-features --locked
      # --all-targets does not run doctests.
      - name: Doctests
        run: cargo test --workspace --doc --all-features --locked

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          v="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '[.packages[].rust_version | select(. != null)] | first // empty')"
          if [ -z "$v" ]; then
            echo "::warning::No rust-version set in Cargo.toml; skipping MSRV check"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Install Rust ${{ steps.msrv.outputs.version }}
        if: steps.msrv.outputs.version != ''
        run: |
          rustup toolchain install "${{ steps.msrv.outputs.version }}" --profile minimal
      - uses: Swatinem/rust-cache@v2
        if: steps.msrv.outputs.version != ''
      - name: cargo check
        if: steps.msrv.outputs.version != ''
        run: cargo "+${{ steps.msrv.outputs.version }}" check --workspace --all-targets --locked

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features --locked

  lockfile:
    name: Cargo.lock up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo metadata --locked --format-version 1 >/dev/null

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  shellcheck:
    name: ShellCheck (install.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/install.sh

  # Single required check for branch protection.
  ci-ok:
    name: CI OK
    if: always()
    needs: [fmt, clippy, test, msrv, docs, lockfile, audit, shellcheck]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            exit 1
          fi